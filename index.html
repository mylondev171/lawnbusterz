  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n/* Stage texture — diamond plate hint */\n.mower-stage::after{content:\"\";position:absolute;inset:0;border-radius:50%;background-image:repeating-conic-gradient(rgba(232,163,40,.06) 0deg 4deg,transparent 4deg 12deg);pointer-events:none;z-index:1}\n\n/* Grass blade upgrade — thicker, more aggressive lean */\n.grass-blade-inner{background:linear-gradient(to top,#0E1A12 0%,#1F3A26 25%,#4d7d54 70%,#a8d6a8 100%);box-shadow:0 0 4px rgba(0,0,0,.7),inset -1px 0 0 rgba(0,0,0,.3)}\n\n/* Sparks layer */\n.blade-sparks{position:absolute;inset:0;z-index:5;pointer-events:none}\n.spark{position:absolute;left:50%;top:50%;width:3px;height:14px;background:linear-gradient(to top,transparent,#fff7cc,#ffd24a,#ff7a1a,transparent);transform-origin:50% 0%;box-shadow:0 0 8px rgba(255,210,74,.9);opacity:0;border-radius:2px}\n.spark.fire{animation:sparkFly var(--dur,.55s) cubic-bezier(.2,.6,.4,1) var(--delay,0s) forwards}\n@keyframes sparkFly{\n  0%{opacity:0;transform:rotate(var(--rot)) translateY(0) scaleY(.4)}\n  10%{opacity:1;transform:rotate(var(--rot)) translateY(20px) scaleY(1)}\n  100%{opacity:0;transform:rotate(var(--rot)) translateY(var(--dist,140px)) scaleY(.2)}\n}\n\n/* Grass shrapnel — chopped-up bits flying out */\n.blade-shrapnel{position:absolute;inset:0;z-index:4;pointer-events:none}\n.shrap{position:absolute;left:50%;top:50%;width:6px;height:14px;background:linear-gradient(to top,#1F3A26,#5e9a64);box-shadow:0 1px 0 rgba(0,0,0,.4);transform-origin:50% 50%;opacity:0;border-radius:1px 1px 4px 4px;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}\n.shrap.fire{animation:shrapFly var(--dur,1.1s) cubic-bezier(.15,.5,.25,1) var(--delay,0s) forwards}\n@keyframes shrapFly{\n  0%{opacity:0;transform:rotate(var(--rot)) translateY(0) rotate(0)}\n  8%{opacity:1}\n  100%{opacity:0;transform:rotate(var(--rot)) translateY(var(--dist,220px)) rotate(var(--tumble,720deg))}\n}\n\n/* Engine smoke under the mower */\n.blade-smoke{position:absolute;inset:0;z-index:3;pointer-events:none}\n.smoke-puf :relative}\n.sister-strip::before,.sister-strip::after{content:\"⬢\";position:absolute;color:var(--marigold);font-size:14px;top:50%;transform:translateY(-50%)}\n.sister-strip::before{left:24px}\n.sister-strip::after{right:24px}\n@media (max-width:768px){.sister-strip::before,.sister-strip::after{display:none}}\n\n/* Founding section — rivets in corners + stripe overlay heavier */\n.founding-counter{position:relative}\n.founding-counter::before,.founding-counter::after{content:\"\";position:absolute;width:8px;height:8px;background:var(--marigold);border-radius:50%}\n.founding-counter::before{top:6px;left:6px}\n.founding-counter::after{top:6px;right:6px}\n\n/* CTA — diagonal hazard band underneath title */\n.cta{position:relative;overflow:hidden}\n.cta::before{content:\"\";position:absolute;left:0;right:0;top:0;height:8px;background-image:repeating-linear-gradient(135deg,var(--ink) 0 14px,transparent 14px 28px)}\n.cta::after{content:\"\";position:absolute;left:0;right:0;bottom:0;height:8px;background-image:repeating-linear-gradient(135deg,var(--ink) 0 14px,transparent 14px 28px)}\n\n/* Coupon — perforation marks + stamp angle */\n.coupon{position:relative}\n.coupon::before{content:\"\";position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--cream)}\n.coupon::after{content:\"\";position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--cream)}\n\n/* Bundle cards — beefier select state */\n.bundle-card.selected{transform:rotate(-1deg)}\n.bundle-card:nth-child(even).selected{transform:rotate(1deg)}\n\n/* Coupons disclaimer plays as \"OFFICIAL NOTICE\" */\n.coupons-disclaimer{position:relative;padding-left:38px}\n.coupons-disclaimer::before{content:\"!\";position:absolute;left:10px;top:50%;transform:translateY(-50%);width:22px;height:22px;background:var(--rust);color:var(--cream);font-family:\"Anton\",sans-serif;font-size:16px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ink)}\n\n/* Service cards — angled corner notch on hover */\n.service-card{position:relative}\n.service-card::before{content:\"\";position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 20px 20px 0;border-color:transparent var(--marigold) transparent transparent;transition:border-color .3s,border-width .3s;z-index:2}\n.service-card:hover::before{border-color:transparent var(--marigold) transparent transparent}\n.service-card.featured::before{border-color:transparent rgba(232,163,40,.15) transparent transparent}\n.service-card::after{content:\"\";position:absolute;inset:0;background-image:linear-gradient(160deg,rgba(14,26,18,.20) 0%,rgba(14,26,18,.55) 50%,rgba(14,26,18,.94) 100%),var(--svc-img,none);background-size:cover;background-position:center;z-index:0;opacity:1;transform:scale(1.04);transition:opacity .6s cubic-bezier(.4,0,.2,1),transform 1.1s cubic-bezier(.4,0,.2,1),filter .6s ease;pointer-events:none;filter:saturate(.92) contrast(1.02)}\n.service-card:hover::after{opacity:0;transform:scale(1.12);filter:saturate(1.05) contrast(1.05)}\n.service-card.featured::after{background-image:linear-gradient(120deg,rgba(14,26,18,.15) 0%,rgba(14,26,18,.50) 45%,rgba(14,26,18,.92) 100%),var(--svc-img,none)}\n.service-card>*{position:relative;z-index:1}\n.service-card[data-service=\"mowing\"]{--svc-img:url(assets/img/svc-mowing.png)}\n.service-card[data-service=\"weedeating\"]{--svc-img:url(assets/img/svc-weedeating.png)}\n.service-card[data-service=\"mulching\"]{--svc-img:url(assets/img/svc-mulching.png)}\n.service-card[data-service=\"weed-control\"]{--svc-img:url(assets/img/svc-weed-control.png)}\n.service-card[data-service=\"flea-spray\"]{--svc-img:url(assets/img/svc-flea-tick.png)}\n.service-card[data-service=\"snow\"]{--svc-img:url(assets/img/svc-snow.png)}\n.service-card[data-service=\"debris\"]{--svc-img:url(assets/img/svc-debris.png)}\n.service-card[data-service=\"skid-steer\"]{--svc-img:url(assets/img/svc-skid-steer.png)}\n.service-card[data-service=\"excavator\"]{--svc-img:url(assets/img/svc-excavator.png)}\n.service-card[data-service=\"french-drain\"]{--svc-img:url(assets/img/svc-french-drain.png)}\n\n/* Tweaks panel hidden by default */\n#tweaksPanel{display:none}\n#tweaksPanel.active{display:block}\n\n/* ============================================================\n   GALLERY — \"RECENT WORK\" PHOTO SHOWCASE\n   ============================================================ */\n.gallery{padding:100px 40px;background:var(--ink);color:var(--cream);position:relative}\n.gallery::before{content:\"\";position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent 0 60px,rgba(232,163,40,.03) 60px 61px);pointer-events:none}\n.gallery-wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto}\n.gallery-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:32px;margin-bottom:48px;padding-bottom:24px;border-bottom:2px solid var(--marigold)}\n.gallery-head h2{font-family:\"Anton\",sans-serif;font-size:clamp(48px,7vw,112px);line-height:.9;text-transform:uppercase}\n.gallery-head h2 em{font-family:\"Fraunces\",serif;font-style:italic;font-weight:300;text-transform:lowercase;color:var(--marigold)}\n.gallery-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}\n.gallery-filter{padding:8px 16px;background:transparent;color:var(--cream-2);border:1px solid var(--line);font-family:\"JetBrains Mono\",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:all .2s}\n.gallery-filter:hover{border-color:var(--marigold);color:var(--cream)}\n.gallery-filter.active{background:var(--marigold);color:var(--ink);border-color:var(--marigold);font-weight:700}\n.gallery-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}\n.gal-card{position:relative;background:var(--moss-2);overflow:hidden;border:2px solid #0a0a0a;box-shadow:4px 4px 0 #050505;trans urn;}\n    if(!window.__emailjsInit){try{emailjs.init({publicKey:window.EMAILJS_PUBLIC_KEY});window.__emailjsInit=true;}catch(e){}}\n    var sv=clean(document.getElementById('qf_service').value);\n    var bn=clean(document.getElementById('qf_bundle').value);\n    var pr=clean(document.getElementById('qf_promo').value);\n    var svLabel=(typeof SN!=='undefined'&&SN[sv])?SN[sv]:sv;\n    if(bn)svLabel+=' (bundle: '+bn+')';\n    if(pr)svLabel+=' (promo: '+pr+')';\n    var params={name:clean(document.getElementById('qf_name').value),phone:clean(document.getElementById('qf_phone').value),email:email||'(not provided)',city:clean(document.getElementById('qf_address').value)||'(not provided)',prop:'(from front-page quote form)',services:svLabel,message:clean(document.getElementById('qf_message').value)||'(no details)',reach:'',urgency:''};\n    emailjs.send(window.EMAILJS_SERVICE_ID,window.EMAILJS_TEMPLATE_ID,params).then(function(){ssh();}).catch(function(err){console.error(\"EmailJS error:\",err);alert(\"Sorry - your message did not go through. Please call (859) 248-0576 or email hello@lawnbusterz.com.\");}).finally(done);\n  });\n})();\n\n// CONFETTI\nfunction fireConfetti(x,y){var c=document.getElementById('confettiCanvas');if(!c){c=document.createElement('canvas');c.id='confettiCanvas';c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9999';document.body.appendChild(c);}c.width=innerWidth;c.height=innerHeight;var ctx=c.getContext('2d'),cols=['#E8A328','#C0461E','#F2EBD8','#2B4D34'],ps=[];for(var i=0;i<90;i++)ps.push({x:x||innerWidth/2,y:y||innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-18-4,g:.45,sz:Math.random()*8+5,col:cols[i%4],rot:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,life:1});(function tick(){ctx.clearRect(0,0,c.width,c.height);var alive=false;ps.forEach(function(p){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.012;if(p.life>0&&p.y<c.height+50){alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=
